# Excerpt for xiaozhi-esp32-server data/.config.yaml (merge into yours).
selected_module:
  LLM: HermesLLM

LLM:
  HermesLLM:
    type: hermes            # the provider from xiaozhi/hermes_provider (apply.py sets this)
    model_name: hermes-agent
    base_url: http://127.0.0.1:8642/v1   # Hermes API server
    api_key: ADD-YOUR-HERMES-API-SERVER-KEY-HERE
    extra_body:
      conversation: jarvis-desk-robot    # one persistent Hermes conversation for the robot
    # Optional provider settings (defaults shown):
    # progress: true        # false = no spoken updates
    # ack_after_s: 3        # "Let me check." if nothing has happened by then
    # still_after_s: 20     # "Still working on it." after this long without speech
    # read_timeout: 300

# The provider drops CJK text, so the TTS voice should be English, e.g. Kokoro:
TTS:
  KokoroTTS:
    language: English

# Keep a conversation open until the user says an end phrase ("bye bye", "good bye",
# "bye jarvis"): no sleep after silence, and no idle disconnect. Trade-off: the robot
# keeps listening, so nearby speech (a meeting, a video) is sent to the agent too.
listen_silence_timeout: 0                  # 0 = never sleep on silence (upstream default 120; was 10 here)
close_connection_no_voice_time: 315360000  # effectively never; 0 would close at once
